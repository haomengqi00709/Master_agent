<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IEC 60617 Symbol KG</title>
<script src="force-graph.js"></script>
<style>
  :root{--bg:#0f1419;--panel:#171e26;--line:#2a343f;--fg:#e6edf3;--mut:#8b98a5;--accent:#4ea1ff;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  #app{display:grid;grid-template-columns:360px 1fr;height:100vh}
  #side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  header{padding:12px 14px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0 0 2px}
  header .sub{color:var(--mut);font-size:12px}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:none;color:var(--mut);padding:9px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
  .pane{flex:1;overflow:auto;padding:12px 14px;min-height:0}
  input,textarea,select{width:100%;background:#0c1116;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:8px 10px;font:inherit}
  textarea{resize:vertical;min-height:60px}
  button.go{margin-top:8px;background:var(--accent);border:none;color:#04101f;font-weight:600;border-radius:7px;padding:8px 12px;cursor:pointer}
  .res{padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:pointer;display:flex;gap:9px;align-items:center}
  .res:hover{border-color:var(--accent)}
  .res img{width:42px;height:34px;object-fit:contain;background:#fff;border-radius:4px;flex:none}
  .res .id{color:var(--accent);font-size:11px;font-family:ui-monospace,monospace}
  .res .lab{font-size:13px}
  .snip{color:var(--mut);font-size:11px;margin-top:8px}
  .snip b{color:var(--fg)}
  .detail h2{font-size:13px;color:var(--accent);font-family:ui-monospace,monospace;margin:0 0 2px}
  .detail .nm{font-size:16px;font-weight:600;margin-bottom:8px}
  .detail img.sym{width:100%;max-height:230px;object-fit:contain;background:#fff;border-radius:8px;padding:6px}
  .kv{color:var(--mut);font-size:12px;margin:6px 0}
  .kv b{color:var(--fg);font-weight:600}
  .sec{margin-top:14px}.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 6px}
  .chip{display:inline-flex;gap:6px;align-items:center;background:#0c1116;border:1px solid var(--line);border-radius:14px;padding:3px 10px;margin:0 5px 5px 0;cursor:pointer;font-size:12px}
  .chip:hover{border-color:var(--accent)}.chip .et{color:var(--mut);font-size:10px}
  .ans{white-space:pre-wrap;background:#0c1116;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;font-size:13px}
  .ans-note{color:var(--mut);font-size:12px;font-style:italic;margin-top:8px}
  #graph{position:relative}
  #fgcanvas{position:absolute;inset:0}
  #legend{position:absolute;top:10px;right:10px;background:rgba(12,17,22,.85);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;z-index:5}
  #legend .row{display:flex;align-items:center;gap:6px;margin:2px 0}
  #legend .dot{width:9px;height:9px;border-radius:50%}
  #ctrls{position:absolute;top:10px;left:10px;z-index:5;display:flex;gap:6px}
  #ctrls select{width:auto;font-size:12px;padding:5px 8px}
  .muted{color:var(--mut)}
  a{color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header><h1>IEC 60617 Symbol Knowledge Graph</h1><div class="sub" id="stat">loading…</div></header>
    <div class="tabs">
      <button class="on" data-t="search">Search</button>
      <button data-t="ask">Ask AI</button>
      <button data-t="detail">Detail</button>
    </div>
    <div class="pane" id="pane-search">
      <input id="q" placeholder="Search symbols (e.g. circuit breaker, earth, fuse)…" autocomplete="off"/>
      <div id="results"></div>
    </div>
    <div class="pane" id="pane-ask" style="display:none">
      <textarea id="qq" placeholder="Ask a question, e.g. How is a protective earth drawn? What's the difference between a contactor and a circuit breaker?"></textarea>
      <button class="go" id="askbtn">Ask</button>
      <div id="answer"></div>
    </div>
    <div class="pane detail" id="pane-detail" style="display:none">
      <div class="muted">Click a node or a search result to see details.</div>
    </div>
  </div>
  <div id="graph">
    <div id="ctrls">
      <select id="partsel"><option value="">All parts</option></select>
    </div>
    <div id="legend"></div>
    <div id="fgcanvas"></div>
  </div>
</div>
<script>
const API="";  // same origin
const PARTCOLOR={"2":"#e0607e","3":"#4ea1ff","6":"#f2c14e","7":"#5fd38b","8":"#b07be0","9":"#46c7c7","13":"#ff9f55","1":"#9aa7b3"};
const typeColor=n=> n.type==="standard"?"#ffffff":n.type==="section"?"#9aa7b3":n.type==="concept"||n.type==="reference"?"#c7a0ff":(PARTCOLOR[n.part]||"#6b7785");
let FG, NODES={}, curPart="";

function tab(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  for(const p of ["search","ask","detail"]) document.getElementById("pane-"+p).style.display = p===t?"":"none";
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));

async function loadGraph(part){
  const g=await (await fetch(`${API}/api/graph${part?`?part=${part}`:""}`)).json();
  NODES={}; g.nodes.forEach(n=>NODES[n.id]=n);
  const el=document.getElementById("graph");
  if(!FG){
    FG=ForceGraph()(document.getElementById("fgcanvas"))
      .backgroundColor("#0f1419")
      .nodeRelSize(4)
      .nodeVal(n=>n.type==="standard"?8:n.type==="section"?4:2)
      .nodeColor(typeColor)
      .nodeLabel(n=>`${n.id} — ${n.label}`)
      .linkColor(()=> "rgba(120,140,160,.18)")
      .linkWidth(0.5)
      .onNodeClick(n=>{showDetail(n.id); FG.centerAt(n.x,n.y,500); FG.zoom(3,500);});
  }
  FG.graphData({nodes:g.nodes.map(n=>({...n})), links:g.edges.map(e=>({source:e.source,target:e.target,type:e.type}))});
  FG.width(el.clientWidth).height(el.clientHeight);
}
addEventListener("resize",()=>{if(FG){const el=document.getElementById("graph");FG.width(el.clientWidth).height(el.clientHeight);}});

async function showDetail(id){
  tab("detail");
  const pane=document.getElementById("pane-detail");
  pane.innerHTML="<div class='muted'>loading…</div>";
  const d=await (await fetch(`${API}/api/symbol/${encodeURIComponent(id)}`)).json();
  if(d.detail){pane.innerHTML="<div class='muted'>not found</div>";return;}
  const n=d.node;
  const desc=(n.body.match(/## Description\s*\n([\s\S]*?)(\n## |\n$|$)/)||[])[1]||"";
  let h=`<h2>${n.id}</h2><div class="nm">${n.label}</div>`;
  if(n.image) h+=`<img class="sym" src="${API}/${n.image}"/>`;
  if(n.name_fr) h+=`<div class="kv"><b>FR:</b> ${n.name_fr}</div>`;
  if(n.standard) h+=`<div class="kv"><b>Standard:</b> ${n.standard}</div>`;
  if(n.form) h+=`<div class="kv"><b>Form:</b> ${n.form}</div>`;
  if(desc.trim()) h+=`<div class="sec"><h3>Description</h3><div>${desc.trim()}</div></div>`;
  if(n.source) h+=`<div class="kv" style="margin-top:10px"><b>Source:</b> ${n.source}</div>`;
  const grp={};
  for(const side of ["out","in"]) for(const e of d.neighbors[side]){(grp[e.type]=grp[e.type]||[]).push(e);}
  for(const t of Object.keys(grp)){
    h+=`<div class="sec"><h3>${t.replace(/_/g," ")}</h3>`;
    h+=grp[t].slice(0,40).map(e=>`<span class="chip" onclick="showDetail('${e.id}')">${e.id}<span class="et">${e.ntype}</span></span>`).join("");
    h+=`</div>`;
  }
  pane.innerHTML=h;
}
window.showDetail=showDetail;

let st;
document.getElementById("q").addEventListener("input",e=>{
  clearTimeout(st); const q=e.target.value.trim();
  st=setTimeout(async()=>{
    const box=document.getElementById("results");
    if(!q){box.innerHTML="";return;}
    const r=await (await fetch(`${API}/api/search?q=${encodeURIComponent(q)}&limit=30`)).json();
    box.innerHTML=r.results.map(x=>`<div class="res" onclick="showDetail('${x.id}')">
      ${x.image?`<img src="${API}/${x.image}"/>`:""}
      <div><div class="id">${x.id} · ${x.type}</div><div class="lab">${x.label}</div>
      ${x.snip?`<div class="snip">${x.snip}</div>`:""}</div></div>`).join("")||"<div class='muted'>no matches</div>";
  },180);
});

document.getElementById("askbtn").onclick=async()=>{
  const q=document.getElementById("qq").value.trim(); if(!q)return;
  const box=document.getElementById("answer"); box.innerHTML="<div class='muted'>thinking…</div>";
  const d=await (await fetch(`${API}/api/ask`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({question:q})})).json();
  let h="";
  if(d.answer) h+=`<div class="ans">${d.answer.replace(/\[(\d\d-[0-9A-Za-z]+-\d\d)\]/g,'<a href="#" onclick="showDetail(\'$1\');return false">[$1]</a>')}</div>`;
  if(d.note) h+=`<div class="ans-note">${d.note}</div>`;
  if(d.citations?.length){h+=`<div class="sec"><h3>Relevant symbols</h3>`+d.citations.map(c=>`<span class="chip" onclick="showDetail('${c.id}')">${c.id}</span>`).join("")+`</div>`;}
  box.innerHTML=h;
};

(async()=>{
  const hh=await (await fetch(`${API}/api/health`)).json();
  document.getElementById("stat").innerHTML=`${hh.nodes} nodes · ${hh.edges} edges · AI ${hh.llm?"on ("+hh.model+")":"off (set ANTHROPIC_API_KEY)"}`;
  // part selector
  const ps=document.getElementById("partsel");
  [["","All parts"],["2","Part 2 · elements"],["3","Part 3 · conductors"],["6","Part 6 · machines"],["7","Part 7 · switchgear"],["8","Part 8 · measuring"],["9","Part 9 · telecom"],["13","Part 13 · analogue"]].forEach(([v,l])=>{if(v==="")return;const o=document.createElement("option");o.value=v;o.textContent=l;ps.appendChild(o);});
  ps.onchange=()=>loadGraph(ps.value);
  // legend
  document.getElementById("legend").innerHTML=Object.entries({"Part 2":"2","Part 3":"3","Part 6":"6","Part 7":"7","Part 8":"8","Part 9":"9","Part 13":"13"}).map(([l,p])=>`<div class="row"><span class="dot" style="background:${PARTCOLOR[p]}"></span>${l}</div>`).join("")+`<div class="row"><span class="dot" style="background:#fff"></span>standard</div><div class="row"><span class="dot" style="background:#9aa7b3"></span>section</div>`;
  await loadGraph("3"); // default: a readable single part
  ps.value="3";
})();
</script>
</body>
</html>
