<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IEC 60617 Symbol KG</title>
<script src="force-graph.js"></script>
<style>
  :root{--bg:#0f1419;--panel:#171e26;--line:#2a343f;--fg:#e6edf3;--mut:#8b98a5;--accent:#4ea1ff;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  #app{display:grid;grid-template-columns:360px 1fr;height:100vh}
  #side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  header{padding:12px 14px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0 0 2px}
  header .sub{color:var(--mut);font-size:12px}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:none;color:var(--mut);padding:9px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
  .pane{flex:1;overflow:auto;padding:12px 14px;min-height:0}
  input,textarea,select{width:100%;background:#0c1116;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:8px 10px;font:inherit}
  textarea{resize:vertical;min-height:60px}
  button.go{margin-top:8px;background:var(--accent);border:none;color:#04101f;font-weight:600;border-radius:7px;padding:8px 12px;cursor:pointer}
  .res{padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:pointer;display:flex;gap:9px;align-items:center}
  .res:hover{border-color:var(--accent)}
  .res img{width:42px;height:34px;object-fit:contain;background:#fff;border-radius:4px;flex:none}
  .res .id{color:var(--accent);font-size:11px;font-family:ui-monospace,monospace}
  .res .lab{font-size:13px}
  .snip{color:var(--mut);font-size:11px;margin-top:8px}
  .snip b{color:var(--fg)}
  .detail h2{font-size:13px;color:var(--accent);font-family:ui-monospace,monospace;margin:0 0 2px}
  .detail .nm{font-size:16px;font-weight:600;margin-bottom:8px}
  .detail img.sym{width:100%;max-height:230px;object-fit:contain;background:#fff;border-radius:8px;padding:6px}
  .kv{color:var(--mut);font-size:12px;margin:6px 0}
  .kv b{color:var(--fg);font-weight:600}
  .sec{margin-top:14px}.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 6px}
  .chip{display:inline-flex;gap:6px;align-items:center;background:#0c1116;border:1px solid var(--line);border-radius:14px;padding:3px 10px;margin:0 5px 5px 0;cursor:pointer;font-size:12px}
  .chip:hover{border-color:var(--accent)}.chip .et{color:var(--mut);font-size:10px}
  .ans{white-space:pre-wrap;background:#0c1116;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;font-size:13px}
  .ans-note{color:var(--mut);font-size:12px;font-style:italic;margin-top:8px}
  #graph{position:relative}
  #fgcanvas{position:absolute;inset:0}
  #legend{position:absolute;top:10px;right:10px;background:rgba(12,17,22,.85);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;z-index:5}
  #legend .row{display:flex;align-items:center;gap:6px;margin:2px 0}
  #legend .dot{width:9px;height:9px;border-radius:50%}
  #ctrls{position:absolute;top:10px;left:10px;z-index:5;display:flex;gap:6px}
  #ctrls select{width:auto;font-size:12px;padding:5px 8px}
  .muted{color:var(--mut)}
  a{color:var(--accent)}
  /* History cards + run popup (partner demo) */
  .badge{display:inline-block;background:var(--accent);color:#04101f;font-weight:700;font-size:10px;border-radius:4px;padding:1px 7px;vertical-align:middle}
  .histcard{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,background .12s}
  .histcard:hover{border-color:var(--accent);background:#0c1116}
  .phase-hdr{font-size:12px;font-weight:600;color:var(--fg);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .phase-hdr .sub{font-weight:400;color:var(--mut);font-size:11px}
  .modal-bg{position:fixed;inset:0;background:rgba(4,8,12,.74);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:38px 16px;overflow:auto}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:880px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .modal .mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:12px 12px 0 0;z-index:2}
  .modal .mhead h2{margin:0;font-size:14px;font-weight:600}
  .modal .x{background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer;line-height:1;flex:none}
  .modal .x:hover{color:var(--fg)}
  .modal .mbody{padding:18px 24px 28px;max-height:calc(88vh - 56px);overflow:auto}
  .modal .mbody .ans{font-size:14px;line-height:1.65}
  .mlabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 0 5px}
  .mlabel:first-child{margin-top:0}
  .qbox{background:#0c1116;border-left:3px solid var(--accent);border-radius:6px;padding:11px 13px;font-size:13.5px;white-space:pre-wrap}
  .steps{margin:6px 0 0;padding-left:20px;font-size:12.5px;color:var(--mut);line-height:1.75;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header><h1>IEC 60617 Symbol Knowledge Graph</h1><div class="sub" id="stat">loading…</div></header>
    <div class="tabs">
      <button class="on" data-t="search">Search</button>
      <button data-t="sow">SOW</button>
      <button data-t="ask">Ask AI</button>
      <button data-t="history">History</button>
      <button data-t="detail">Detail</button>
    </div>
    <div class="pane" id="pane-search">
      <input id="q" placeholder="Search symbols (e.g. circuit breaker, earth, fuse)…" autocomplete="off"/>
      <div id="results"></div>
    </div>
    <div class="pane" id="pane-sow" style="display:none">
      <div class="muted" style="font-size:12px;margin-bottom:6px">Paste a Statement of Work — get the relevant standard clauses and symbols.</div>
      <textarea id="sowtext" style="min-height:120px" placeholder="e.g. The contractor shall repair and overhaul flameproof motor enclosures in Zone 1 hazardous areas and restore certification; single-line diagrams shall use IEC symbols for circuit breakers and disconnectors…"></textarea>
      <button class="go" id="sowbtn">Find relevant standards</button>
      <div id="sowout"></div>
    </div>
    <div class="pane" id="pane-ask" style="display:none">
      <textarea id="qq" placeholder="Ask a question, e.g. How is a protective earth drawn? What's the difference between a contactor and a circuit breaker?"></textarea>
      <button class="go" id="askbtn">Ask</button>
      <div id="answer"></div>
    </div>
    <div class="pane" id="pane-history" style="display:none">
      <div class="muted">loading…</div>
    </div>
    <div class="pane detail" id="pane-detail" style="display:none">
      <div class="muted">Click a node or a search result to see details.</div>
    </div>
  </div>
  <div id="graph">
    <div id="ctrls">
      <select id="partsel"><option value="">All parts</option></select>
    </div>
    <div id="legend"></div>
    <div id="fgcanvas"></div>
  </div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhead"><h2 id="mtitle"></h2><button class="x" onclick="closeModal()" title="Close (Esc)">×</button></div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>
<script>
const API="";  // same origin
const PARTCOLOR={"2":"#e0607e","3":"#4ea1ff","6":"#f2c14e","7":"#5fd38b","8":"#b07be0","9":"#46c7c7","13":"#ff9f55","1":"#9aa7b3"};
const typeColor=n=> n.type==="standard"?"#ffffff":n.type==="section"?"#9aa7b3":n.type==="concept"||n.type==="reference"?"#c7a0ff":(PARTCOLOR[n.part]||"#6b7785");
const PART_PALETTE=["#e0607e","#4ea1ff","#f2c14e","#5fd38b","#b07be0","#46c7c7","#ff9f55","#7ed0a0","#e08fce","#8fa8e0","#d4b483","#6fcf97","#cf6f6f"];
function buildPartControls(){
  // derive the parts (+ colours, dropdown, legend) from the loaded graph so new parts auto-appear
  const parts=[...new Set(Object.values(NODES).filter(n=>n.type==="symbol"&&n.part!=null).map(n=>String(n.part)))]
    .sort((a,b)=>{const na=/^\d+$/.test(a),nb=/^\d+$/.test(b);return na&&nb?(+a-+b):a.localeCompare(b);});
  parts.forEach((p,i)=>{ if(!PARTCOLOR[p]) PARTCOLOR[p]=PART_PALETTE[i%PART_PALETTE.length]; });
  const ps=document.getElementById("partsel");
  ps.innerHTML='<option value="">All parts</option><option value="standards">📄 Standards (docs)</option>';
  parts.forEach(p=>{ const std=NODES["60617-"+p]; const t=std&&std.label?(" · "+std.label.slice(0,26)):"";
    const o=document.createElement("option"); o.value=p; o.textContent="Part "+p+t; ps.appendChild(o); });
  document.getElementById("legend").innerHTML=
    parts.map(p=>`<div class="row"><span class="dot" style="background:${PARTCOLOR[p]}"></span>Part ${p}</div>`).join("")
    +`<div class="row"><span class="dot" style="background:#fff"></span>standard</div>`
    +`<div class="row"><span class="dot" style="background:#c7a0ff"></span>concept</div>`
    +`<div class="row"><span class="dot" style="background:#9aa7b3"></span>section</div>`;
}
let FG, NODES={}, curPart="";

function tab(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  for(const p of ["search","sow","ask","history","detail"]) document.getElementById("pane-"+p).style.display = p===t?"":"none";
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab(b.dataset.t); if(b.dataset.t==="history") loadHistory();});

async function loadGraph(sel){
  const qs = sel==="standards" ? "?docs=1" : (sel ? "?part="+sel : "");
  const g=await (await fetch(`${API}/api/graph${qs}`)).json();
  NODES={}; g.nodes.forEach(n=>NODES[n.id]=n);
  const el=document.getElementById("graph");
  if(!FG){
    FG=ForceGraph()(document.getElementById("fgcanvas"))
      .backgroundColor("#0f1419")
      .nodeRelSize(4)
      .nodeVal(n=>n.type==="standard"?8:n.type==="section"?4:2)
      .nodeColor(typeColor)
      .nodeLabel(n=>`${n.id} — ${n.label}`)
      .linkColor(()=> "rgba(120,140,160,.18)")
      .linkWidth(0.5)
      .onNodeClick(n=>{showDetail(n.id); FG.centerAt(n.x,n.y,500); FG.zoom(3,500);});
  }
  FG.graphData({nodes:g.nodes.map(n=>({...n})), links:g.edges.map(e=>({source:e.source,target:e.target,type:e.type}))});
  FG.width(el.clientWidth).height(el.clientHeight);
}
addEventListener("resize",()=>{if(FG){const el=document.getElementById("graph");FG.width(el.clientWidth).height(el.clientHeight);}});

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderBody(md){
  // strip the H1, image markdown and <sub> captions (shown separately), then
  // render the prose: ## headings, - lists, **bold**, and clickable [[wikilinks]].
  let t=(md||"").replace(/^#\s+.*$/m,"").replace(/!\[[^\]]*\]\([^)]*\)/g,"")
        .replace(/<sub>[\s\S]*?<\/sub>/g,"").trim();
  if(!t) return "";
  const inline=(s)=>esc(s)
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]+)?\|([^\]]+)\]\]/g,(m,tg,lb)=>`<a href="#" onclick="showDetail('${tg.trim()}');return false">${lb}</a>`)
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]+)?\]\]/g,(m,tg)=>`<a href="#" onclick="showDetail('${tg.trim()}');return false">${tg.trim()}</a>`)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  let out="",inList=false;
  for(let ln of t.split(/\n/)){
    ln=ln.trim();
    if(!ln){if(inList){out+="</ul>";inList=false;}continue;}
    if(/^#{2,}\s+/.test(ln)){if(inList){out+="</ul>";inList=false;}out+=`<h3>${inline(ln.replace(/^#{2,}\s+/,""))}</h3>`;continue;}
    if(/^[-*]\s+/.test(ln)){if(!inList){out+="<ul>";inList=true;}out+=`<li>${inline(ln.replace(/^[-*]\s+/,""))}</li>`;continue;}
    if(inList){out+="</ul>";inList=false;}
    out+=`<p>${inline(ln)}</p>`;
  }
  if(inList)out+="</ul>";
  return out;
}
function renderAnswer(md){
  // render an AI answer: ## headings, **bold**, - lists, and clickable [id] / [[link]] citations.
  let t=(md||"").trim(); if(!t) return "";
  const inline=(s)=>esc(s)
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]+)?\|([^\]]+)\]\]/g,(m,tg,lb)=>`<a href="#" onclick="showDetail('${tg.trim()}');return false">${lb}</a>`)
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]+)?\]\]/g,(m,tg)=>`<a href="#" onclick="showDetail('${tg.trim()}');return false">${tg.trim()}</a>`)
    .replace(/\[([0-9A-Za-z][0-9A-Za-z\-]+)\]/g,(m,id)=>`<a href="#" onclick="showDetail('${id}');return false">[${id}]</a>`)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  let out="",inList=false;
  for(let ln of t.split(/\n/)){
    ln=ln.trim();
    if(!ln){if(inList){out+="</ul>";inList=false;}continue;}
    if(/^#{1,6}\s+/.test(ln)){if(inList){out+="</ul>";inList=false;}out+=`<h3>${inline(ln.replace(/^#{1,6}\s+/,""))}</h3>`;continue;}
    if(/^[-*]\s+/.test(ln)){if(!inList){out+="<ul>";inList=true;}out+=`<li>${inline(ln.replace(/^[-*]\s+/,""))}</li>`;continue;}
    if(inList){out+="</ul>";inList=false;}
    out+=`<p>${inline(ln)}</p>`;
  }
  if(inList)out+="</ul>";
  return out;
}
function renderMeta(d){
  // show how the local agent worked: usage line + collapsible step trace.
  let h=""; const u=d.usage||{};
  if(u.turns!=null){
    const fresh=((u.input||0)+(u.output||0))/1000;
    h+=`<div style="opacity:.6;font-size:12px;margin:8px 0 2px">⚙ ${u.turns} steps · ${u.duration_s}s · ~${fresh.toFixed(1)}k new tokens${u.cost_usd!=null?" · $"+(u.cost_usd).toFixed(2):""}</div>`;
  }
  if(d.trace&&d.trace.length){
    const reads=d.trace.filter(s=>s.indexOf("Read")===0).length;
    h+=`<details style="font-size:12px;margin:2px 0 6px"><summary style="cursor:pointer;opacity:.7">trace — ${d.trace.length} tool calls, ${reads} pages read</summary>`+
       `<ol style="margin:6px 0 0 18px;opacity:.85;line-height:1.5">`+d.trace.map(s=>`<li>${esc(s)}</li>`).join("")+`</ol></details>`;
  }
  return h;
}
async function showDetail(id){
  tab("detail");
  const pane=document.getElementById("pane-detail");
  pane.innerHTML="<div class='muted'>loading…</div>";
  const d=await (await fetch(`${API}/api/symbol/${encodeURIComponent(id)}`)).json();
  if(d.detail){pane.innerHTML="<div class='muted'>not found</div>";return;}
  const n=d.node;
  let h=`<h2>${n.id}</h2><div class="nm">${n.label}</div>`;
  if(n.image) h+=`<img class="sym" src="${API}/${n.image}"/>`;
  if(n.name_fr) h+=`<div class="kv"><b>FR:</b> ${n.name_fr}</div>`;
  if(n.standard) h+=`<div class="kv"><b>Standard:</b> ${n.standard}</div>`;
  if(n.form) h+=`<div class="kv"><b>Form:</b> ${n.form}</div>`;
  const bodyHtml=renderBody(n.body);
  if(bodyHtml) h+=`<div class="sec body">${bodyHtml}</div>`;
  if(n.source) h+=`<div class="kv" style="margin-top:10px"><b>Source:</b> ${n.source}</div>`;
  const grp={};
  for(const side of ["out","in"]) for(const e of d.neighbors[side]){(grp[e.type]=grp[e.type]||[]).push(e);}
  for(const t of Object.keys(grp)){
    h+=`<div class="sec"><h3>${t.replace(/_/g," ")}</h3>`;
    h+=grp[t].slice(0,40).map(e=>`<span class="chip" onclick="showDetail('${e.id}')">${e.id}<span class="et">${e.ntype}</span></span>`).join("");
    h+=`</div>`;
  }
  pane.innerHTML=h;
}
window.showDetail=showDetail;

let HISTRUNS=[];
async function loadHistory(){
  const box=document.getElementById("pane-history");
  box.innerHTML="<div class='muted'>loading…</div>";
  let d; try{ d=await (await fetch(`${API}/api/history?limit=200`)).json(); }catch(e){ box.innerHTML="<div class='muted'>history unavailable</div>"; return; }
  HISTRUNS=d.items||[];
  if(!HISTRUNS.length){ box.innerHTML="<div class='muted'>No runs yet — results from the SOW and Ask AI tabs stack here for the team to review.</div>"; return; }
  const PHASE={"full-volume":["Full-volume corpus","after full ingestion — 1474 nodes, 23 standards"],"baseline":["Baseline","before full ingestion — ~967 nodes, 2 standards"]};
  // group newest-first, but order phases full-volume → baseline
  const order=["full-volume","baseline"];
  const groups={}; HISTRUNS.forEach((it,i)=>{(groups[it.phase||"baseline"]=groups[it.phase||"baseline"]||[]).push(i);});
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="muted" style="font-size:12px">${d.total} run(s) · click any to open</div><button class="go" style="margin:0;padding:4px 10px;font-size:12px" onclick="clearHistory()">Clear</button></div>`;
  for(const ph of order){
    if(!groups[ph]) continue;
    const lbl=PHASE[ph]||[ph,""];
    h+=`<div class="phase-hdr">${lbl[0]} <span class="sub">· ${lbl[1]} · ${groups[ph].length} runs</span></div>`;
    for(const i of groups[ph]){
      const it=HISTRUNS[i];
      const badge=it.kind==="sow"?"SOW":"Ask";
      const q=esc((it.query||"").trim());
      const qshort=q.length>120?q.slice(0,120)+"…":q;
      const u=it.usage||{};
      const meta=(it.model?` · ${esc(it.model)}`:"")+(u.turns!=null?` · ${u.turns} steps`:"")+(u.cost_usd!=null?` · $${(u.cost_usd).toFixed(2)}`:"")+(it.citations?` · ${it.citations.length} pages`:"");
      h+=`<div class="histcard" onclick="openRunModal(HISTRUNS[${i}])"><span class="badge">${badge}</span> <span class="muted" style="font-size:11px">${esc(it.ts||"")}${meta}</span><div style="font-size:13px;margin-top:4px">${qshort}</div></div>`;
    }
  }
  box.innerHTML=h;
}
function openRunModal(r){
  if(!r) return;
  const u=r.usage||{}, badge=r.kind==="sow"?"SOW":"ASK";
  const bits=[]; if(r.phase)bits.push(r.phase==="full-volume"?"full-volume · 1474 nodes":"baseline · ~967 nodes"); if(r.model)bits.push(r.model); if(u.turns!=null)bits.push(u.turns+" steps"); if(u.cost_usd!=null)bits.push("$"+(u.cost_usd).toFixed(2)); if(r.citations)bits.push(r.citations.length+" pages cited");
  document.getElementById("mtitle").innerHTML=`<span class="badge">${badge}</span> <span class="muted" style="font-size:12px;font-weight:400">${esc(r.ts||"")}${bits.length?" · "+bits.join(" · "):""}</span>`;
  let h=`<div class="mlabel">${r.kind==="sow"?"Statement of Work":"Question"}</div><div class="qbox">${esc((r.query||"").trim())}</div>`;
  h+=`<div class="mlabel">Answer</div><div class="ans">${renderAnswer(r.answer||"")}</div>`;
  if(r.trace&&r.trace.length){
    const reads=r.trace.filter(s=>s.indexOf("Read")===0).length;
    h+=`<div class="sec"><h3>How it navigated the knowledge base — ${r.trace.length} steps, ${reads} pages read</h3><ol class="steps">`+r.trace.map(s=>`<li>${esc(s)}</li>`).join("")+`</ol></div>`;
  } else {
    h+=`<div class="ans-note">Step-by-step trace not retained for this run; live runs record the full navigation trace.</div>`;
  }
  if(r.citations&&r.citations.length){
    h+=`<div class="sec"><h3>Pages cited (${r.citations.length})</h3>`+r.citations.map(c=>`<span class="chip" onclick="closeModal();showDetail('${c.id}')">${c.id}<span class="et">${esc((c.label||'').slice(0,24))}</span></span>`).join("")+`</div>`;
  }
  document.getElementById("mbody").innerHTML=h;
  document.getElementById("mbody").scrollTop=0;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
async function clearHistory(){ if(!confirm("Clear all run history for everyone?"))return; await fetch(`${API}/api/history`,{method:"DELETE"}); loadHistory(); }
window.loadHistory=loadHistory; window.clearHistory=clearHistory; window.openRunModal=openRunModal; window.closeModal=closeModal;

let st;
document.getElementById("q").addEventListener("input",e=>{
  clearTimeout(st); const q=e.target.value.trim();
  st=setTimeout(async()=>{
    const box=document.getElementById("results");
    if(!q){box.innerHTML="";return;}
    const r=await (await fetch(`${API}/api/search?q=${encodeURIComponent(q)}&limit=30`)).json();
    box.innerHTML=r.results.map(x=>`<div class="res" onclick="showDetail('${x.id}')">
      ${x.image?`<img src="${API}/${x.image}"/>`:""}
      <div><div class="id">${x.id} · ${x.type}</div><div class="lab">${x.label}</div>
      ${x.snip?`<div class="snip">${x.snip}</div>`:""}</div></div>`).join("")||"<div class='muted'>no matches</div>";
  },180);
});

document.getElementById("askbtn").onclick=async()=>{
  const q=document.getElementById("qq").value.trim(); if(!q)return;
  const box=document.getElementById("answer"); box.innerHTML="<div class='muted'>thinking…</div>";
  const d=await (await fetch(`${API}/api/ask`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({question:q})})).json();
  let h="";
  if(d.answer) h+=`<div class="ans">${renderAnswer(d.answer)}</div>`;
  if(d.note) h+=`<div class="ans-note">${d.note}</div>`;
  h+=renderMeta(d);
  if(d.citations?.length){h+=`<div class="sec"><h3>Pages cited</h3>`+d.citations.map(c=>`<span class="chip" onclick="showDetail('${c.id}')">${c.id}<span class="et">${(c.label||'').slice(0,22)}</span></span>`).join("")+`</div>`;}
  box.innerHTML=h;
};

document.getElementById("sowbtn").onclick=async()=>{
  const t=document.getElementById("sowtext").value.trim(); if(!t)return;
  const box=document.getElementById("sowout"); box.innerHTML="<div class='muted'>analysing…</div>";
  const d=await (await fetch(`${API}/api/sow`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:t})})).json();
  let h="";
  if(d.answer) h+=`<div class="ans">${renderAnswer(d.answer)}</div>`;
  if(d.note) h+=`<div class="ans-note">${d.note}</div>`;
  h+=renderMeta(d);
  if(d.citations?.length){h+=`<div class="sec"><h3>${d.answer?"Pages cited":"Relevant pages (keyword match)"}</h3>`+d.citations.map(x=>`<span class="chip" onclick="showDetail('${x.id}')">${x.id}<span class="et">${(x.label||'').slice(0,22)}</span></span>`).join("")+`</div>`;}
  box.innerHTML=h||"<div class='muted'>no matches</div>";
};

(async()=>{
  const hh=await (await fetch(`${API}/api/health`)).json();
  document.getElementById("stat").innerHTML=`${hh.nodes} nodes · ${hh.edges} edges · AI ${hh.llm?"on ("+hh.model+")":"off (set ANTHROPIC_API_KEY)"}`;
  // part selector (populated data-driven after the graph loads)
  const ps=document.getElementById("partsel");
  ps.onchange=()=>loadGraph(ps.value);
  await loadGraph(""); // default: all parts → populates NODES with every part
  buildPartControls();  // build dropdown + legend + colours from the actual graph
  ps.value="";
})();
</script>
